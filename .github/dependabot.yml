---
# Only security updates open PRs: version updates are switched off with
# open-pull-requests-limit: 0 on every entry.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
