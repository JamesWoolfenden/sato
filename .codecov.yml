coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  - "main.go"
  - "**/*_test.go"
  - "vendor/**/*"
  - "tests/**/*"
  - "tools/**/*"
  - "scripts/**/*"

comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: false
